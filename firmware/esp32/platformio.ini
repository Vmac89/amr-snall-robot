; ESP32 DevKit V1 (ESP-WROOM-32) scaffold.
; PlatformIO espressif32 7.x still packages Arduino-ESP32 2.0.17, so PWM
; uses ledcSetup / ledcAttachPin rather than the Arduino core 3.x API.
; GPIO assignments live in include/pins.h and are proposed, not measured.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -Wextra
